<svg id="onyx-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1"></stop>
                            <stop offset="100%" style="stop-color:#000000;stop-opacity:1"></stop>
                        </linearGradient>
                        <linearGradient id="grad-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1"></stop>
                            <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1"></stop>
                            <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1"></stop>
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="10" result="coloredBlur"></feGaussianBlur>
                            <feMerge>
                                <feMergeNode in="coloredBlur"></feMergeNode>
                                <feMergeNode in="SourceGraphic"></feMergeNode>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Background -->
                    <rect width="512" height="512" fill="url(#grad1)"></rect>
                    
                    <!-- Subtle Grid Texture (Optional, for tech feel) -->
                    <path d="M0 128 H512 M0 256 H512 M0 384 H512 M128 0 V512 M256 0 V512 M384 0 V512" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"></path>

                    <!-- Main Symbol: Abstract Crystal O -->
                    <g transform="translate(256, 256)">
                        <!-- Outer Ring -->
                        <path d="M-130 -75 L0 -150 L130 -75 L130 75 L0 150 L-130 75 Z" fill="none" stroke="url(#grad-stroke)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></path>
                        
                        <!-- Inner Crystal Shards -->
                        <path d="M0 -150 L0 -40" stroke="#8B5CF6" stroke-width="8" stroke-opacity="0.5" stroke-linecap="round"></path>
                        <path d="M0 150 L0 40" stroke="#3B82F6" stroke-width="8" stroke-opacity="0.5" stroke-linecap="round"></path>
                        <path d="M-130 -75 L-35 -20" stroke="#6366F1" stroke-width="8" stroke-opacity="0.3" stroke-linecap="round"></path>
                        <path d="M130 75 L35 20" stroke="#F59E0B" stroke-width="8" stroke-opacity="0.3" stroke-linecap="round"></path>
                        
                        <!-- Center Core -->
                        <circle r="20" fill="#ffffff" fill-opacity="0.9" filter="url(#glow)"></circle>
                    </g>
                </svg>